    config-desc:
      server-name: 'Server name shown in plugin messages and the GUI.'
      language: 'Language code used by the plugin, for example zh_CN or en_US.'
      storage:
        directory: 'Directory that stores report data files. A restart is required after changing it.'
        backup-on-save: 'Copy the existing store before writing so a failed write cannot destroy it.'
        max-backups: 'How many backups are kept for each store file.'
        backup-interval-minutes: 'How often the store is backed up automatically, in minutes.'
        shutdown-timeout-seconds: 'How long shutdown waits for pending writes to finish.'
        compact-after-entries: 'How many write-ahead log entries accumulate before they are folded into reports.json.'
        compact-interval-minutes: 'Maximum minutes between two automatic write-ahead log compactions.'
      limits:
        command-cooldown-millis: 'Minimum milliseconds between two /report commands from one player.'
        cooldown-seconds: 'Seconds a player must wait between submitting reports.'
        daily-limit: 'Maximum reports one player may submit per day.'
        same-target-interval-seconds: 'Minimum seconds between reports against the same player.'
        duplicate-window-seconds: 'Identical reports inside this window are treated as duplicates.'
        max-open-per-target: 'Maximum unresolved reports that may exist for one target.'
        min-account-age-minutes: 'How many minutes a player account must exist before reporting.'
        block-self-report: 'When enabled, players cannot report themselves.'
        allow-offline-target: 'When enabled, players who are offline can be reported.'
        require-target-online: 'When enabled, the target must be online when a report is submitted.'
        bypass-permission: 'Players with this permission ignore report cooldowns and limits.'
      reports:
        text-page-size: 'Reports shown per page in text commands such as /reports list.'
        gui-page-size: 'Entries shown per page in admin GUI lists.'
        auto-close-enabled: 'Automatically close reports that stay open for too long.'
        auto-close-days: 'How many days after creation a report is closed automatically.'
        retention-days: 'How many days closed reports stay in storage.'
        maintenance-interval-minutes: 'How often background cleanup, backup and statistics tasks run.'
        stats-top-targets: 'How many players are shown in the most-reported leaderboard.'
        staff-stats-top: 'How many staff members are shown in staff statistics.'
        default-category: 'Category used when a player does not choose one.'
        priority:
          enabled: 'Calculate report priority from repeat offenders and overdue rules.'
          repeat-offender-threshold: 'How many reports against a target mark them as a repeat offender.'
          repeat-offender-level: 'Priority assigned once the repeat offender threshold is reached.'
          overdue-check-minutes: 'How often reports are checked against their handling deadline.'
          overdue-alert-enabled: 'Alert online staff when a report passes its deadline.'
          sla-hours:
            urgent: 'Hours allowed to handle urgent reports.'
            high: 'Hours allowed to handle high priority reports.'
            normal: 'Hours allowed to handle normal priority reports.'
            low: 'Hours allowed to handle low priority reports.'
        replies:
          enabled: 'Allow players and staff to add replies to reports.'
          allow-player-replies: 'When enabled, regular players may reply to their own reports.'
          max-length: 'Maximum characters allowed in one reply.'
          max-per-report: 'Maximum number of replies allowed on one report.'
          notify: 'Notify the people involved when a report receives a reply.'
        chat-report:
          enabled: 'Allow selecting chat messages as evidence when reporting.'
          category: 'Category used for reports created from chat messages.'
          max-selected: 'Maximum chat messages that can be selected for one report.'
      gui:
        enabled: 'Whether the plugin graphical interface is enabled.'
        fill-empty-slots: 'Fill unused GUI slots with decorative items.'
        close-on-action: 'Close the current menu automatically after performing an action.'
        sounds:
          enabled: 'Play sounds when GUI buttons are clicked.'
          click: 'Sound played when a button is clicked.'
          success: 'Sound played when an action succeeds.'
          error: 'Sound played when an action fails.'
        admin:
          enabled: 'Allow staff to open the full admin interface.'
          confirm-destructive: 'Ask for confirmation before destructive actions such as deletes.'
      notifications:
        staff:
          enabled: 'Notify online staff when a new report arrives.'
          permission: 'Only staff with this permission receive report notifications.'
          sound-enabled: 'Play a sound when staff are notified.'
          sound: 'Sound played for staff notifications.'
        reporter:
          enabled: 'Notify the reporter when a report changes state.'
          queue-offline: 'Store notifications while the reporter is offline and deliver them on join.'
          max-queued: 'Maximum queued notifications stored per player.'
          queue-retention-days: 'How many days queued notifications are kept.'
        watchlist:
          enabled: 'Allow staff to follow specific players and receive their reports.'
          max-targets: 'Maximum players one staff member may follow.'
          notify-on-report: 'Alert staff when a player on their watchlist is reported.'
        broadcast:
          enabled: 'Broadcast new reports to the whole server.'
        webhook:
          enabled: 'Send report events to an external webhook.'
          url: 'Webhook URL that receives report events.'
          timeout-seconds: 'Maximum seconds to wait for a webhook request.'
          username: 'Username shown on webhook messages.'
          avatar-url: 'Avatar image URL used by webhook messages.'
          events:
            created: 'Send a webhook when a report is created.'
            claimed: 'Send a webhook when a report is claimed.'
            closed: 'Send a webhook when a report is closed.'
          retry-count: 'How many times a failed webhook send is retried before giving up (exponential backoff).'
          retry-base-seconds: 'Base seconds of the exponential backoff between webhook retries.'
          failure-alert-enabled: 'Notify online staff in game when a webhook send fails after all retries.'
          secondary-url: 'Optional second webhook URL; SLA breach summaries and failure alerts route here when configured.'
